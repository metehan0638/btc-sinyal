name: BTC sinyal kontrol

on:
  schedule:
    - cron: "30 08 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kütüphaneleri kur
        run: pip install ccxt pandas numpy pyyaml

      - name: Sinyalleri kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_PUBLIC_URL: https://data-api.binance.vision/api/v3
        run: python check_signals.py

      - name: Durumu repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "durum güncellendi" && git push)
