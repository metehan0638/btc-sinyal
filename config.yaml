# Genel ayarlar
symbol: BTC/USDT
exchanges: [binance, kraken, bitstamp]   # sırayla denenir, ilk çalışan kullanılır
since: "2017-08-17"                      # Binance BTC/USDT başlangıcı
assets:                                  # sistemde yalnızca Bitcoin var (MVRV Z-Score yalnızca BTC içindir)
  - ticker: BTC
    name: Bitcoin
    symbol: BTC/USDT
    since: "2017-08-17"

# DİP SKORU (genel skor, -100..+100)
# Her gösterge yalnızca 5 etiketten birini üretir: Güçlü Dip · Dip · Nötr · Şişmiş · Aşırı Şişmiş.
# Etiketler ortak puana çevrilir (+100 · +50 · 0 · -50 · -100) ve genel skor = toplam puan / aktif gösterge sayısıdır.
# Verisi olmayan gösterge nötr sayılmaz, hesaba girmez. Skor her zaman -100..+100 arasındadır.
# Genel skor etiketi: >= +60 Güçlü Dip · >= +20 Dip · -20..+20 Nötr · <= -20 Şişmiş · <= -60 Aşırı Şişmiş.
#
# Skora girecek göstergeler (yalnızca burada listelenenler kullanılır). Yeni gösterge eklemek için core/indicators.py içinde
# sınıfı yazıp REGISTRY'e ekle, sonra buraya anahtarını yaz. Eşikler kodda sabittir.
#   rsi:        Wilder RSI. < 30 Güçlü Dip · 30-35 Dip · 35-65 Nötr · 65-70 Şişmiş · > 70 Aşırı Şişmiş
#   bollinger:  Bollinger %B (0 alt bant, 0.5 orta bant, 1 üst bant). < 0 Güçlü Dip · 0-0.10 Dip · 0.10-0.90 Nötr · 0.90-1 Şişmiş · > 1 Aşırı Şişmiş
#   mfi:        Money Flow Index (hacimli RSI benzeri). < 20 Güçlü Dip · 20-30 Dip · 30-70 Nötr · 70-80 Şişmiş · > 80 Aşırı Şişmiş
#   fear_greed: Fear & Greed endeksi (alternative.me, günlük). 0-20 Güçlü Dip · 21-34 Dip · 35-69 Nötr · 70-79 Şişmiş · 80-100 Aşırı Şişmiş
#   mvrv:       MVRV Z-Score (Coin Metrics, yalnızca Bitcoin, günlük). < 0 Güçlü Dip · 0-1 Dip · 1-3 Nötr · 3-7 Şişmiş · >= 7 Aşırı Şişmiş
# fear_greed ve mvrv günlük veridir: günlük mumda o günün değeri, haftalık/aylık mumda dönemin günlük ortalaması kullanılır
# (aggregate: mean). aggregate: last yazarsan dönemin son günü alınır. Dönemin bir günü bile eksikse o mum için değer üretilmez.
# mvrv için max_stale_days: yayın gecikmesinde son bilinen değerin en fazla kaç gün ileri taşınacağı.
indicators:
  rsi:
    period: 14
  bollinger:
    period: 20
    mult: 2
  mfi:
    period: 14
  fear_greed:
    aggregate: mean
  mvrv:
    aggregate: mean
    max_stale_days: 2

fear_greed_info: true                    # rapor sonunda ve panelde Fear & Greed değerini ayrıca göster (skor için fear_greed göstergesi gerekir)
daily_report: true                       # günde bir Telegram raporu
