# Genel ayarlar
symbol: BTC/USDT
exchanges: [binance, kraken, bitstamp]   # sırayla denenir, ilk çalışan kullanılır
since: "2017-08-17"                      # Binance BTC/USDT başlangıcı

# Genel bölge kararı: göstergelerin en az bu oranı ucuz (ya da şişmiş) bölgedeyse DİP (ya da ŞİŞMİŞ) denir
zone_ratio: 0.5

# Zaman dilimine özel ayarlar (belirtilmeyenler varsayılan kalır).
# zones: gösterge: [ucuz eşiği, şişmiş eşiği]  ->  değer <= ucuz eşiği ise UCUZ, değer >= şişmiş eşiği ise ŞİŞMİŞ.
# Varsayılanlar: rsi [30,70] · stochrsi [20,80] · bollinger [0.10,0.90] · mfi [20,80]
#                ma_ratio [0.85,2.0] · drawdown [-50,-10] · fear_greed [24,75]
# Bunlar başlangıç değerleridir; kendi görüşüne göre değiştirebilirsin.
timeframes:
  1d:
    ma_long: 200            # fiyat / 200 günlük ortalama
  1w:
    ma_long: 200            # fiyat / 200 haftalık ortalama
    zones:
      ma_ratio: [1.2, 3.5]  # haftalık 200 ortalamaya göre ölçek farklıdır
