# DİP SKORU (genel skor, -100..+100)
# Her gösterge yalnızca 5 etiketten birini üretir: Güçlü Dip · Dip · Nötr · Şişmiş · Aşırı Şişmiş.
# Etiketler ortak puana çevrilir (+100 · +50 · 0 · -50 · -100) ve genel skor = toplam puan / aktif gösterge sayısıdır.
# Verisi olmayan gösterge nötr sayılmaz, hesaba girmez. Skor her zaman -100..+100 arasındadır.
# Genel skor etiketi: >= +60 Güçlü Dip · >= +20 Dip · -20..+20 Nötr · <= -20 Şişmiş · <= -60 Aşırı Şişmiş.
#
# Skora girecek göstergeler (yalnızca burada listelenenler kullanılır). Yeni gösterge eklemek için core/indicators.py içinde
# sınıfı yazıp REGISTRY'e ekle, sonra buraya anahtarını yaz.
#   rsi: Wilder RSI. < 30 Güçlü Dip · 30-35 Dip · 35-65 Nötr · 65-70 Şişmiş · > 70 Aşırı Şişmiş (eşikler kodda sabittir)
indicators:
  rsi:
    period: 14

fear_greed: true                         # rapor sonunda ve panelde bilgi olarak gösterilir; skora GİRMEZ
daily_report: true                       # günde bir Telegram raporu
